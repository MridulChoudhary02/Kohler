version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kohler_postgres
    environment:
      POSTGRES_USER: kohler
      POSTGRES_PASSWORD: kohler
      POSTGRES_DB: kohler_hospital
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kohler -d kohler_hospital"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kohler_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://kohler:kohler@postgres:5432/kohler_hospital
      SYNC_DATABASE_URL: postgresql+psycopg2://kohler:kohler@postgres:5432/kohler_hospital
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
